<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixabay 이미지 슬라이더</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 12px; font-family: sans-serif; background: #f4f6f8; color: #222; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 14px; }
    .form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .form input { padding: 10px 12px; font-size: 1rem; border: 1px solid #c9d1d9; border-radius: 8px; }
    #apiKey { flex: 1 1 260px; }
    #query { flex: 1 1 200px; }
    .form button { padding: 10px 20px; font-size: 1rem; border: none; border-radius: 8px; background: #2e75b6; color: #fff; cursor: pointer; }
    #status { min-height: 1.5em; color: #555; margin: 8px 0 12px; font-size: 0.95rem; }
    .slider { display: flex; align-items: center; gap: 8px; }
    .arrow { flex: none; width: 44px; height: 44px; border: none; border-radius: 50%; background: #2e75b6; color: #fff; font-size: 1.3rem; cursor: pointer; }
    .arrow:disabled { background: #b8c4d0; cursor: default; }
    .row { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; min-width: 0; }
    .row img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: #dde3ea; display: block; }
    .page { text-align: center; margin-top: 10px; color: #555; font-size: 0.9rem; }
    @media (max-width: 640px) { .row { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🖼️ Pixabay 이미지 슬라이더</h1>

    <div class="form">
      <input id="apiKey" type="password" placeholder="Pixabay API Key 입력">
      <input id="query" type="text" placeholder="검색어 입력 (예: jeju, 한라봉)">
      <button id="searchBtn">검색</button>
    </div>
    <div id="status">API Key와 검색어를 입력하고 검색을 눌러 주세요.</div>

    <div class="slider">
      <button class="arrow" id="prev" disabled aria-label="이전">◀</button>
      <div class="row" id="row"></div>
      <button class="arrow" id="next" disabled aria-label="다음">▶</button>
    </div>
    <div class="page" id="page"></div>
  </div>

  <script>
    const PER_SLIDE = 5;
    const keyInput = document.getElementById('apiKey');
    const queryInput = document.getElementById('query');
    const statusEl = document.getElementById('status');
    const row = document.getElementById('row');
    const pageEl = document.getElementById('page');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let images = [];
    let start = 0;

    function render() {
      row.innerHTML = '';
      images.slice(start, start + PER_SLIDE).forEach(img => {
        const el = document.createElement('img');
        el.src = img.webformatURL;
        el.alt = img.tags;
        el.title = img.tags;
        row.appendChild(el);
      });
      const total = Math.ceil(images.length / PER_SLIDE);
      pageEl.textContent = images.length ? `${start / PER_SLIDE + 1} / ${total}` : '';
      prevBtn.disabled = start === 0;
      nextBtn.disabled = start + PER_SLIDE >= images.length;
    }

    async function search() {
      const key = keyInput.value.trim();
      const q = queryInput.value.trim();
      if (!key || !q) {
        statusEl.textContent = 'API Key와 검색어를 모두 입력해 주세요.';
        return;
      }
      statusEl.textContent = '검색 중...';
      try {
        const url = `https://pixabay.com/api/?key=${encodeURIComponent(key)}&q=${encodeURIComponent(q)}&image_type=photo&per_page=30&safesearch=true`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status === 400 ? 'API Key가 올바르지 않거나 요청이 잘못되었습니다.' : `오류 (${res.status})`);
        const data = await res.json();
        images = data.hits;
        start = 0;
        statusEl.textContent = images.length ? `"${q}" 검색 결과 ${images.length}장` : '검색 결과가 없습니다.';
        render();
      } catch (e) {
        statusEl.textContent = e.message;
      }
    }

    document.getElementById('searchBtn').addEventListener('click', search);
    queryInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    prevBtn.addEventListener('click', () => { start = Math.max(0, start - PER_SLIDE); render(); });
    nextBtn.addEventListener('click', () => { start += PER_SLIDE; render(); });
  </script>
</body>
</html>
